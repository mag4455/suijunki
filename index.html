<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水準器</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app">
    <header>
      <p class="eyebrow">SPIRIT LEVEL</p>
      <h1>水準器</h1>
    </header>

    <div class="tool">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>

      <section class="vial-row round-row" data-axis="xy">
        <div class="vial-label">
          <span class="vial-name">水平</span>
          <span class="vial-sub">ROLL / PITCH</span>
        </div>
        <div class="vial round" id="vialXY">
          <div class="crosshair"></div>
          <div class="ring-target"></div>
          <div class="bubble" id="bubbleXY"></div>
        </div>
        <div class="readout-pair">
          <div class="readout-item">
            <span class="mini-label">左右</span>
            <span class="readout" id="readoutX">--.-°</span>
          </div>
          <div class="readout-item">
            <span class="mini-label">前後</span>
            <span class="readout" id="readoutY">--.-°</span>
          </div>
        </div>
      </section>

      <section class="vial-row vertical-row" data-axis="z">
        <div class="vial-label">
          <span class="vial-name">垂直</span>
          <span class="vial-sub">PLUMB</span>
        </div>
        <div class="vial vertical" id="vialZ">
          <div class="center-marks"></div>
          <div class="bubble" id="bubbleZ"></div>
        </div>
        <div class="readout" id="readoutZ">--.-°</div>
      </section>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn primary">センサーを開始</button>
      <div class="control-pair" id="calibControls" hidden>
        <button id="calibBtn" class="btn ghost">この姿勢でゼロ調整</button>
        <button id="resetBtn" class="btn ghost">校正リセット</button>
      </div>
      <p class="status" id="status">ボタンを押してセンサーへのアクセスを許可してください。</p>
    </div>

    <p class="hint">水平を測るときはスマホを平らな面に置いて、丸い気泡が中央の輪に入るか確認。垂直(プラム)を測るときはスマホを壁や柱に立てかけて確認してください。</p>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
